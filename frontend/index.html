<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <script>
      /* apply the saved theme before first paint so there is no white flash in dark mode */
      try { if (localStorage.getItem("theme") === "dark") { document.documentElement.classList.add("dark"); document.querySelector('meta[name="theme-color"]').setAttribute("content", "#000000"); } } catch (e) {}
    </script>
    <title>Green Ocean Sporting Events — Game on</title>
    <meta name="description" content="Green Ocean Sporting Events — game on. Join weekly community games, build team rosters, host tournaments with live brackets and play in official Green Ocean events — every sport." />
    <style>
      html, body { margin: 0; background: #FFFFFF; }
      html.dark, html.dark body { background: #000000; }
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #0B1B2B; background: radial-gradient(circle at 20% 10%, rgba(16,185,129,.10), transparent 45%), radial-gradient(circle at 85% 85%, rgba(14,165,233,.12), transparent 45%), #FFFFFF; }
      #boot .logo { width: 132px; height: 132px; border-radius: 30px; object-fit: cover; box-shadow: 0 10px 30px rgba(3,105,161,.25); animation: boot-pulse 1.8s ease-in-out infinite; }
      #boot .name { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; background: linear-gradient(90deg, #0284C7, #059669); -webkit-background-clip: text; background-clip: text; color: transparent; }
      #boot .bar { width: 150px; height: 4px; border-radius: 4px; background: #DCE9F0; overflow: hidden; }
      #boot .bar i { display: block; width: 45%; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #0284C7, #14B8A6, #34D399); animation: boot-slide 1.1s ease-in-out infinite; }
      #boot .hint { max-width: 260px; text-align: center; font-size: 13px; line-height: 1.4; color: #5B7083; min-height: 36px; opacity: 0; transition: opacity .4s; }
      #boot .hint.on { opacity: 1; }
      html.dark #boot { color: #F8FAFC; background: radial-gradient(circle at 20% 10%, rgba(16,185,129,.14), transparent 45%), radial-gradient(circle at 85% 85%, rgba(14,165,233,.16), transparent 45%), #000000; }
      html.dark #boot .bar { background: #2A3640; }
      html.dark #boot .hint { color: #94A3B8; }
      @keyframes boot-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      @keyframes boot-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(240%); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status" aria-live="polite">
        <img class="logo" src="/logo-512.jpg" alt="" />
        <div class="bar"><i></i></div>
        <div class="hint" id="boot-hint">Waking things up - the first visit can take up to a minute. Game on!</div>
      </div>
    </div>
    <script>
      setTimeout(function () { var h = document.getElementById('boot-hint'); if (h) h.className = 'hint on'; }, 4000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
