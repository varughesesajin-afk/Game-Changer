<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match Days · Games All Day</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="has-bottom-nav dark-theme">
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="/"><span class="logo">🏆</span> Games All Day</a>
    <nav class="topnav hide-on-mobile">
      <a href="/">Events</a>
      <a href="/matchdays.html">Match Days</a>
      <a href="/admin.html">Organizer login</a>
    </nav>
  </div>
</header>

<div class="wrap">
  <div class="page-hero">
    <h1>Match Days</h1>
    <p>Casual games and training sessions — add your name to the list, no team registration needed.</p>
  </div>

  <div id="matchdays" class="grid" style="margin-top:20px;">
    <div class="empty-state"><span class="spinner"></span></div>
  </div>
</div>

<footer class="site-footer">Games All Day</footer>

<nav class="bottom-nav">
  <a href="/">
    <svg class="bn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1h3.5v-5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v5H17.5a1 1 0 0 0 1-1v-9"/></svg>
    <span>Home</span>
  </a>
  <a href="/matchdays.html" class="active">
    <svg class="bn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17"/><path d="M8 3v4M16 3v4"/></svg>
    <span>Match Days</span>
  </a>
  <a href="/admin.html">
    <svg class="bn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 19 6v5.5c0 4.5-3 7.8-7 9-4-1.2-7-4.5-7-9V6z"/><path d="m9 12 2 2 4-4"/></svg>
    <span>Organizer</span>
  </a>
</nav>

<script src="/js/api.js"></script>
<script>
async function load() {
  const el = document.getElementById("matchdays");
  try {
    const matchdays = await api.get("/api/matchdays");
    if (!matchdays.length) {
      el.innerHTML = `<div class="empty-state">No match days scheduled yet. Check back soon.</div>`;
      return;
    }
    el.innerHTML = matchdays.map(matchdayCard).join("");
  } catch (e) {
    el.innerHTML = `<div class="alert error">Couldn't load match days: ${escapeHtml(e.message)}</div>`;
  }
}

function matchdayCard(md) {
  const full = md.signupCount >= md.maxPlayers;
  const closed = md.status !== "open";
  const badgeClass = closed ? "" : full ? "warning" : "accent";
  const badgeLabel = closed ? "Closed" : full ? "Full" : "Open";
  return `
    <a class="event-card" href="/matchday.html?id=${encodeURIComponent(md.id)}">
      <span class="badge ${badgeClass}">${badgeLabel}</span>
      <h3>${escapeHtml(md.name || "Match Day")}</h3>
      ${md.venue ? `<div class="muted small">📍 ${escapeHtml(md.venue)}</div>` : ""}
      <div class="small muted">📅 ${escapeHtml(fmtDateOnly(md.date))}${md.time ? " · " + escapeHtml(md.time) : ""}</div>
      <div class="small muted">${md.signupCount}/${md.maxPlayers} players signed up</div>
    </a>
  `;
}

load();
</script>
</body>
</html>
